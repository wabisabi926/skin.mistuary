name: Build skin zip

# 版本号变了才打包发布；改代码不升版本不会产生新 Release。
# 需要强制重打包时，在 Actions 页面手动运行并勾选 force。
#
# action 一律钉 commit SHA，不用 @v4 这种浮动标签（标签可被上游改写，
# 等于把供应链交给别人）。升级时先核对 action.yml 的 inputs 没改名，
# 再换 SHA 并更新行尾注释里的版本号。
#   actions/checkout            v7.0.1  node24
#   actions/setup-python        v7.1.0  node24
#   softprops/action-gh-release v3.0.3  node24（annotated tag，SHA 取 peeled commit）
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 忽略版本号检查，强制重新打包
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 先跑静态检查：XML 结构、缺失引用、生成变量是否与 map 同步、单元测试
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # test_xbt_tool 会 import xbt_tool，而 xbt_tool 顶层就 import PIL。
      # 不装的话整个 test 任务直接 ModuleNotFoundError，发布被卡住。
      - name: Install Pillow
        run: pip install --quiet "pillow==11.3.0"

      - name: Unit tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v

      - name: Static audit
        run: python tools/audit_skin.py --strict

      # 生成器表与盘上产物漂移：--strict 只查"XML 引用的贴图在不在"，
      # 查不出"表里登记了但没生成"，所以三条 --check 单独跑一遍。
      - name: Generated textures in sync
        run: |
          python tools/gen_corner_masks.py --check
          python tools/gen_rings.py --check
          python tools/gen_glass_plates.py --check

      - name: Generated variables in sync
        run: python tools/gen_techflag_vars.py --check

      # 只校验已入库的图标产物与 IconMap/TextMap 是否对齐，不依赖本机的源皮肤素材
      - name: Technical flag icons in sync
        run: python tools/gen_techflag_icons.py --check

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 需要历史才能和上一次的 addon.xml 比较版本号

      - name: Read addon id / version / name
        id: meta
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET
          root = ET.parse("addon.xml").getroot()
          print(f"id={root.get('id')}")
          print(f"version={root.get('version')}")
          print(f"name={root.get('name')}")
          PY

      - name: Check version change
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEW="${{ steps.meta.outputs.version }}"
          # 和"本次 push 之前"的 addon.xml 比，而不是"上一次改 addon.xml 的提交"：
          # 后者在"升版本后又提交了别的文件"时会取到升版前的版本号，导致重复发布。
          BASE="${{ github.event.before }}"
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            # workflow_dispatch / 首个提交：退回上一个提交
            BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          OLD=""
          if [ -n "${BASE}" ]; then
            OLD="$(git show "${BASE}:addon.xml" 2>/dev/null | python -c \
              'import sys,xml.etree.ElementTree as ET; print(ET.fromstring(sys.stdin.read()).get("version"))' || true)"
          fi
          echo "基线版本: ${OLD:-<无>} / 本次版本: ${NEW}"
          if [ "${OLD}" = "${NEW}" ]; then
            echo "版本号未变化，跳过打包"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v${NEW}" >/dev/null 2>&1; then
            echo "v${NEW} 已发布过，跳过（避免同名附件被覆盖）"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.check.outputs.changed == 'true' || github.event.inputs.force == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Pillow
        if: steps.check.outputs.changed == 'true' || github.event.inputs.force == 'true'
        run: pip install --quiet "pillow==11.3.0"

      # Textures.xbt 已入库；这里再跑一次是防止有人改了图忘了打包
      - name: Pack textures
        if: steps.check.outputs.changed == 'true' || github.event.inputs.force == 'true'
        run: python tools/xbt_tool.py pack

      # 从 changelog.txt 里截出"当前版本"那一段，作为 Release 正文
      - name: Extract changelog for this version
        if: steps.check.outputs.changed == 'true' || github.event.inputs.force == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build
          python - <<'PY'
          import os, re, sys
          version = os.environ["VERSION"]
          lines = open("changelog.txt", encoding="utf-8").read().splitlines()
          # 版本段 = 以 "<x.y.z> " 开头的行，到下一个同格式行为止
          head = re.compile(r"^\d+\.\d+\.\d+\s")
          # 分类行 "[新增]" 这类在正文里渲染成三级标题，否则和条目同字号、分不出层次
          section = re.compile(r"^\[(.+?)\]$")
          title, out, inside = version, [], False
          for line in lines:
              if head.match(line):
                  if inside:
                      break
                  if line.split()[0] == version:
                      inside, title = True, line.strip()
                  continue
              if inside:
                  out.append(section.sub(r"### \1", line.strip()) if section.match(line.strip()) else line)
          # 页面标题已经是 "Mistuary <版本>"，正文 H2 再去掉一遍版本号
          heading = re.sub(r"^\d+\.\d+\.\d+\s*", "", title) or version
          body = "\n".join(out).strip() or "（changelog.txt 里没有对应段落）"
          with open("build/RELEASE_NOTES.md", "w", encoding="utf-8") as f:
              f.write(f"## {heading}\n\n{body}\n")
          print("--- RELEASE_NOTES.md ---")
          print(open("build/RELEASE_NOTES.md", encoding="utf-8").read()[:600])
          PY

      # 只保留"能装进 Kodi 的东西"：开发脚本、文档、CI 配置都不进包
      - name: Stage addon
        if: steps.check.outputs.changed == 'true' || github.event.inputs.force == 'true'
        env:
          ADDON_ID: ${{ steps.meta.outputs.id }}
        run: |
          set -euo pipefail
          mkdir -p "build/${ADDON_ID}"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.workbuddy-ai/' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='docs/' \
            --exclude='build/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='tools/' \
            ./ "build/${ADDON_ID}/"
          # 发布包的 media/ 里只留 Textures.xbt，松散图片和子目录都不带
          find "build/${ADDON_ID}/media" -mindepth 1 -maxdepth 1 \
            ! -name 'Textures.xbt' -exec rm -rf {} +
          echo "--- 包内容预览 ---"
          du -sh "build/${ADDON_ID}"
          find "build/${ADDON_ID}" -maxdepth 1 -mindepth 1 | sort

      # 包名固定为「插件名-版本号.zip」
      - name: Create zip
        id: zip
        if: steps.check.outputs.changed == 'true' || github.event.inputs.force == 'true'
        env:
          ADDON_ID: ${{ steps.meta.outputs.id }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          cd build
          ZIP="${ADDON_ID}-${VERSION}.zip"
          zip -r -q "${ZIP}" "${ADDON_ID}"
          ls -lh "${ZIP}"
          echo "path=build/${ZIP}" >> "$GITHUB_OUTPUT"
          echo "name=${ZIP}" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        if: steps.check.outputs.changed == 'true' || github.event.inputs.force == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: ${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }}
          # 正文取自 changelog.txt 的对应段落
          body_path: build/RELEASE_NOTES.md
          # 皮肤包 + 完整日记
          files: |
            ${{ steps.zip.outputs.path }}
            changelog.txt
          make_latest: true
          fail_on_unmatched_files: true
