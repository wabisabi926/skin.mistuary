name: Build skin zip

# 只有 addon.xml 里的版本号变了才打包发布；改代码不升版本不会产生新 Release。
# 需要强制重打包时，在 Actions 页面手动运行并勾选 force。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 忽略版本号检查，强制重新打包
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 先跑静态检查：XML 结构、缺失引用、生成变量是否与 map 同步、22 专属写法是否有 21 守卫
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests
        run: python -m unittest discover -s extras -p 'test_*.py' -v

      - name: Static audit
        run: python extras/audit_skin.py --strict

      - name: Generated variables in sync
        run: python extras/gen_techflag_vars.py --check

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要历史才能和上一次的 addon.xml 比较版本号

      - name: Read addon id / version / name
        id: meta
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET
          root = ET.parse("addon.xml").getroot()
          print(f"id={root.get('id')}")
          print(f"version={root.get('version')}")
          print(f"name={root.get('name')}")
          PY

      - name: Check version change
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEW="${{ steps.meta.outputs.version }}"
          # 和"本次 push 之前"的 addon.xml 比，而不是"上一次改 addon.xml 的提交"：
          # 后者在"升版本后又提交了别的文件"时会取到升版前的版本号，导致重复发布。
          BASE="${{ github.event.before }}"
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            # workflow_dispatch / 首个提交：退回上一个提交
            BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          OLD=""
          if [ -n "${BASE}" ]; then
            OLD="$(git show "${BASE}:addon.xml" 2>/dev/null | python -c \
              'import sys,xml.etree.ElementTree as ET; print(ET.fromstring(sys.stdin.read()).get("version"))' || true)"
          fi
          echo "基线版本: ${OLD:-<无>} / 本次版本: ${NEW}"
          if [ "${OLD}" = "${NEW}" ]; then
            echo "版本号未变化，跳过打包"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v${NEW}" >/dev/null 2>&1; then
            echo "v${NEW} 已发布过，跳过（避免同名附件被覆盖）"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.check.outputs.changed == 'true' || github.event.inputs.force == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        if: steps.check.outputs.changed == 'true' || github.event.inputs.force == 'true'
        run: pip install --quiet "pillow==11.3.0"

      # Textures.xbt 已入库；这里再跑一次是防止有人改了图忘了打包
      - name: Pack textures
        if: steps.check.outputs.changed == 'true' || github.event.inputs.force == 'true'
        run: python xbt_tool.py pack

      # 只保留"能装进 Kodi 的东西"：开发脚本、文档、CI 配置都不进包
      - name: Stage addon
        if: steps.check.outputs.changed == 'true' || github.event.inputs.force == 'true'
        env:
          ADDON_ID: ${{ steps.meta.outputs.id }}
        run: |
          set -euo pipefail
          mkdir -p "build/${ADDON_ID}"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.workbuddy-ai/' \
            --exclude='.gitignore' \
            --exclude='docs/' \
            --exclude='build/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='xbt_tool.py' \
            --exclude='extras/*.py' \
            --exclude='extras/*.ps1' \
            --exclude='extras/*.html' \
            ./ "build/${ADDON_ID}/"
          # 发布包的 media/ 里只留 Textures.xbt，松散图片和子目录都不带
          find "build/${ADDON_ID}/media" -mindepth 1 -maxdepth 1 \
            ! -name 'Textures.xbt' -exec rm -rf {} +
          echo "--- 包内容预览 ---"
          du -sh "build/${ADDON_ID}"
          find "build/${ADDON_ID}" -maxdepth 1 -mindepth 1 | sort

      - name: Create zip
        id: zip
        if: steps.check.outputs.changed == 'true' || github.event.inputs.force == 'true'
        env:
          ADDON_ID: ${{ steps.meta.outputs.id }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          cd build
          ZIP="${ADDON_ID}-${VERSION}.zip"
          zip -r -q "${ZIP}" "${ADDON_ID}"
          ls -lh "${ZIP}"
          echo "path=build/${ZIP}" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        if: steps.check.outputs.changed == 'true' || github.event.inputs.force == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: ${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }}
          files: ${{ steps.zip.outputs.path }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
