name: Build skin zip

# 只有 addon.xml 里的版本号变了才打包发布；改代码不升版本不会产生新 Release。
# 需要强制重打包时，在 Actions 页面手动运行并勾选 force。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 忽略版本号检查，强制重新打包
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要历史才能和上一次的 addon.xml 比较版本号

      - name: Read addon id / version / name
        id: meta
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET
          root = ET.parse("addon.xml").getroot()
          print(f"id={root.get('id')}")
          print(f"version={root.get('version')}")
          print(f"name={root.get('name')}")
          PY

      - name: Check version change
        id: check
        run: |
          set -euo pipefail
          NEW="${{ steps.meta.outputs.version }}"
          # 上一次改动 addon.xml 的提交（跳过当前这次）
          PREV_COMMIT="$(git log -1 --skip=1 --format=%H -- addon.xml || true)"
          if [ -z "${PREV_COMMIT}" ]; then
            echo "没有历史版本，视为首次发布"
            OLD=""
          else
            OLD="$(git show "${PREV_COMMIT}:addon.xml" | python -c \
              'import sys,xml.etree.ElementTree as ET; print(ET.fromstring(sys.stdin.read()).get("version"))')"
          fi
          echo "旧版本: ${OLD:-<无>} / 新版本: ${NEW}"
          if [ "${OLD}" = "${NEW}" ]; then
            echo "版本号未变化，跳过打包"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.check.outputs.changed == 'true' || github.event.inputs.force == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        if: steps.check.outputs.changed == 'true' || github.event.inputs.force == 'true'
        run: pip install --quiet pillow

      # Textures.xbt 已入库；这里再跑一次是防止有人改了图忘了打包
      - name: Pack textures
        if: steps.check.outputs.changed == 'true' || github.event.inputs.force == 'true'
        run: python xbt_tool.py pack

      # 只保留"能装进 Kodi 的东西"：开发脚本、文档、CI 配置都不进包
      - name: Stage addon
        if: steps.check.outputs.changed == 'true' || github.event.inputs.force == 'true'
        env:
          ADDON_ID: ${{ steps.meta.outputs.id }}
        run: |
          set -euo pipefail
          mkdir -p "build/${ADDON_ID}"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.workbuddy-ai/' \
            --exclude='.gitignore' \
            --exclude='docs/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='xbt_tool.py' \
            --exclude='extras/*.py' \
            --exclude='extras/*.ps1' \
            --exclude='extras/*.html' \
            ./ "build/${ADDON_ID}/"
          # 发布包的 media/ 里只留 Textures.xbt，松散图片和子目录都不带
          find "build/${ADDON_ID}/media" -mindepth 1 -maxdepth 1 \
            ! -name 'Textures.xbt' -exec rm -rf {} +
          echo "--- 包内容预览 ---"
          du -sh "build/${ADDON_ID}"
          find "build/${ADDON_ID}" -maxdepth 1 -mindepth 1 | sort

      - name: Create zip
        id: zip
        if: steps.check.outputs.changed == 'true' || github.event.inputs.force == 'true'
        env:
          ADDON_ID: ${{ steps.meta.outputs.id }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          cd build
          ZIP="${ADDON_ID}-${VERSION}.zip"
          zip -r -q "${ZIP}" "${ADDON_ID}"
          ls -lh "${ZIP}"
          echo "path=build/${ZIP}" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        if: steps.check.outputs.changed == 'true' || github.event.inputs.force == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: ${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }}
          files: ${{ steps.zip.outputs.path }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
